name: ci

on:
  push:

jobs:
  check:
    runs-on: nix
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - uses: actions/checkout@v4

      - name: Unlock
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/gc.key"
          git-crypt unlock "$RUNNER_TEMP/gc.key"
          rm "$RUNNER_TEMP/gc.key"
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}

      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nixfmt --check

      - name: statix
        run: statix check .

      - name: deadnix
        run: deadnix --fail --no-lambda-arg .

      # - name: flake check
      #   run: nix flake check --no-build
